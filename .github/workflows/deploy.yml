name: Deploy Python App to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Code Quality & Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Basic Health Endpoint Test
        run: |
          python -c "import app; print('Application imported successfully!')"

  deploy:
    name: Build & Trigger AWS CodeDeploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Application Bundle
        run: |
          mkdir -p build_artifact
          zip -r build_artifact/deployment-package.zip . -x ".git/*" -x ".github/*"

      - name: Upload Artifact to S3
        run: |
          aws s3 cp build_artifact/deployment-package.zip s3://${{ secrets.S3_DEPLOYMENT_BUCKET }}/deployment-package.zip

      - name: Create CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_DEPLOYMENT_BUCKET }},key=deployment-package.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE
